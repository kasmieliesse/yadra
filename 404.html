<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yadra!</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;background:#0A0A0A;color:#E6E6E6;font-family:-apple-system,'Segoe UI',sans-serif;height:100%;display:flex;align-items:center;justify-content:center;}
  p{font-size:13px;letter-spacing:.05em;color:#9C9C9C;}
</style>
<script>
  // GitHub Pages SPA fallback: stash the intended URL and hand off to index.html,
  // which restores it via history.replaceState (see inline script near end of body there).
  sessionStorage.setItem('yadra_redirect', location.pathname + location.search + location.hash);
  location.replace('/');
</script>
</head>
<body>
<p>yadra! — redirection…</p>
</body>
</html>
